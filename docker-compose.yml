version: "3.9"

# The live site runs in k3s, not here: deploy with `sh scripts/deploy.sh`.
# This service sits behind a profile so a plain `docker compose up` doesn't start a second copy
# writing the same tournament data. Only for running it in Docker on purpose:
#   docker compose --profile docker up -d --build
services:
  unmatched:
    profiles: ["docker"]
    container_name: unmatched
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Tournaments: secrets come from .env (gitignored, copy it to the server), saved data lives in ./data
    env_file: .env
    volumes:
      - ./data:/app/data

    # only needed inside docker; nginx will reach it via proxy_net
    expose:
      - "8001"

    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
