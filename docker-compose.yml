version: "3.9"

services:
  unmatched:
    container_name: unmatched
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Tournaments: secrets come from .env (gitignored, copy it to the server), saved data lives in ./data
    env_file: .env
    volumes:
      - ./data:/app/data

    # only needed inside docker; nginx will reach it via proxy_net
    expose:
      - "8001"

    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
